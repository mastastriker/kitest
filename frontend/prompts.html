<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Themen verwalten</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="theme-toggle">
        <span>Dark Mode</span>
        <label class="switch">
          <input id="theme-toggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
      <header>
        <h1>Themen</h1>
        <p class="lede">Themen verwalten und Post-Eigenschaften pro Thema festlegen.</p>
        <nav class="nav">
          <a class="ghost-link" href="index.html">Zur Beitragsübersicht</a>
          <a class="ghost-link" href="news.html">News</a>
        </nav>
      </header>

      <section class="panel">
        <h2>Neues Thema</h2>
        <form id="topic-form" class="stack">
          <label>
            Titel
            <input type="text" id="topic-name" placeholder="z. B. Produktivität, AI News" required />
          </label>
          <button type="submit">Thema anlegen</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Themen</h2>
        </div>
        <div id="topics" class="topics"></div>
      </section>
    </main>
    <script src="theme.js"></script>
    <script src="prompts.js"></script>
  </body>
</html>
