<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Themen verwalten</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="theme-toggle">
      <span>Dark Mode</span>
      <label class="switch">
        <input id="theme-toggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
    <main class="page">
      <nav class="primary-nav" aria-label="Hauptnavigation">
        <a class="nav-home" href="index.html" aria-label="Home">🏠</a>
        <a class="is-active" href="prompts.html" aria-current="page">Themen &amp; Prompts</a>
        <a href="news.html">News</a>
      </nav>
      <header>
        <h1>Themen</h1>
        <p class="lede">Themen verwalten und Post-Eigenschaften pro Thema festlegen.</p>
      </header>

      <section class="panel">
        <h2>Neues Thema</h2>
        <form id="topic-form" class="stack">
          <label>
            Titel
            <input type="text" id="topic-name" placeholder="z. B. Produktivität, AI News" required />
          </label>
          <button type="submit">Thema anlegen</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Themen</h2>
        </div>
        <div id="topics" class="topics"></div>
      </section>
    </main>
    <script src="theme.js"></script>
    <script src="prompts.js"></script>
  </body>
</html>
