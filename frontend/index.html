<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KI X-Post Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="theme-toggle">
        <span>Dark Mode</span>
        <label class="switch">
          <input id="theme-toggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
      <header>
        <h1>KI X-Post Generator v8</h1>
        <p class="lede">Übersicht aller erstellten Beiträge.</p>
        <nav class="nav">
          <a class="ghost-link" href="prompts.html">Themen &amp; Prompts verwalten</a>
        </nav>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>Beiträge</h2>
          <button id="refresh-posts" type="button">Aktualisieren</button>
        </div>
        <div id="posts" class="posts-overview"></div>
      </section>
    </main>
    <script src="theme.js"></script>
    <script src="posts.js"></script>
  </body>
</html>
