<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trends für X</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="theme-toggle">
      <span>Dark Mode</span>
      <label class="switch">
        <input id="theme-toggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
    <main class="page">
      <nav class="primary-nav" aria-label="Hauptnavigation">
        <a class="nav-home" href="index.html" aria-label="Post Generator">🏠</a>
        <a href="index.html">Post Generator</a>
        <a href="drafts.html">Entwürfe &amp; Freigabe</a>
        <a href="posts.html">Posts Übersicht</a>
        <a href="prompts.html">Themen &amp; Prompts</a>
        <a href="news.html">News</a>
        <a class="is-active" href="trends.html" aria-current="page">Trends</a>
      </nav>
      <header>
        <h1>Trend-Ideen für X</h1>
        <p class="lede">Wähle ein Thema und einen Modus, um aktuelle Trends als Post-Grundlage zu erhalten.</p>
      </header>

      <section class="panel">
        <h2>Trend-Generator</h2>
        <form id="trend-form" class="stack">
          <label>
            Thema auswählen
            <select id="trend-topic" required>
              <option value="">Thema auswählen ...</option>
            </select>
          </label>
          <fieldset class="mode-fieldset">
            <legend>Modus</legend>
            <label class="radio-field">
              <input type="radio" name="trend-mode" value="current" required />
              Aktuelle Trends
            </label>
            <label class="radio-field">
              <input type="radio" name="trend-mode" value="controversy" />
              Kontroverse Themen
            </label>
            <label class="radio-field">
              <input type="radio" name="trend-mode" value="questions" />
              Offene Fragen
            </label>
          </fieldset>
          <button type="submit">Themen generieren</button>
        </form>
        <p id="trend-status" class="muted small" role="status" aria-live="polite"></p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Trend-Ergebnis</h2>
        </div>
        <ol id="trend-list" class="trend-list"></ol>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Trend-Prompt</h2>
        </div>
        <pre id="trend-prompt" class="code-block muted">Noch kein Prompt generiert.</pre>
      </section>
    </main>
    <script src="theme.js"></script>
    <script src="trends.js"></script>
  </body>
</html>
