<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trends</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="theme-toggle">
      <span>Dark Mode</span>
      <label class="switch">
        <input id="theme-toggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
    <main class="page">
      <nav class="primary-nav" aria-label="Hauptnavigation">
        <a class="nav-home" href="index.html" aria-label="Home">🏠</a>
        <a href="prompts.html">Themen &amp; Prompts</a>
        <a href="news.html">News</a>
        <a class="is-active" href="trends.html" aria-current="page">Trends</a>
      </nav>
      <header>
        <h1>Trends</h1>
        <p class="lede">
          Aus aktiven RSS-Feeds werden Themen nach Häufigkeit bewertet. Pro Thema erscheinen die Top 10
          Trends. Über den Button je Trend kannst du eine kurze Zusammenfassung erstellen lassen.
        </p>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>Aktuelle Trends</h2>
          <button id="refresh-trends" type="button">Aktualisieren</button>
        </div>
        <p id="trends-status" class="muted small" role="status" aria-live="polite"></p>
        <div id="trends-content" class="trends-content muted">Noch keine Trends geladen.</div>
      </section>
    </main>
    <script src="theme.js"></script>
    <script src="trends.js"></script>
  </body>
</html>
