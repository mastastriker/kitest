<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Themenverwaltung</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="theme-toggle">
      <span>Dark Mode</span>
      <label class="switch">
        <input id="theme-toggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
    <main class="page">
      <nav class="primary-nav" aria-label="Hauptnavigation">
        <a class="nav-home" href="index.html" aria-label="Post Generator">🏠</a>
        <a href="index.html">Post Generator</a>
        <a href="drafts.html">Entwürfe &amp; Freigabe</a>
        <a href="posts.html">Posts Übersicht</a>
        <a href="news.html">News</a>
        <a href="themes.html" class="is-active" aria-current="page">Themen</a>
        <a href="settings.html">Settings</a>
      </nav>
      <header>
        <h1>Themenverwaltung</h1>
        <p class="lede">Lege neue Themen an und verwalte deren Status, ohne die Generierung zu beeinflussen.</p>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>Neues Thema</h2>
        </div>
        <form id="theme-form" class="stack">
          <label>
            Key
            <input type="text" id="theme-key" placeholder="z. B. crypto" required />
          </label>
          <label>
            Name
            <input type="text" id="theme-name" placeholder="z. B. Crypto" required />
          </label>
          <label class="checkbox-field">
            <input type="checkbox" id="theme-active" checked />
            Aktiv
          </label>
          <button type="submit">Theme anlegen</button>
        </form>
        <p id="theme-status" class="muted small" role="status" aria-live="polite"></p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Bestehende Themen</h2>
          <span id="theme-count" class="badge">0</span>
        </div>
        <div id="theme-list" class="theme-list muted">Noch keine Themes erfasst.</div>
      </section>
    </main>
    <script src="theme.js"></script>
    <script src="themes.js"></script>
  </body>
</html>
