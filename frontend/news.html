<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="theme-toggle">
      <span>Dark Mode</span>
      <label class="switch">
        <input id="theme-toggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
    <main class="page">
      <nav class="primary-nav" aria-label="Hauptnavigation">
        <a class="nav-home" href="index.html" aria-label="Home">🏠</a>
        <a href="prompts.html">Themen &amp; Prompts</a>
        <a class="is-active" href="news.html" aria-current="page">News</a>
      </nav>
      <header>
        <h1>News</h1>
        <p class="lede">Teste die News-API und inspiziere Antworten für RSS-Feeds.</p>
      </header>

      <section class="panel">
        <h2>Feed abrufen</h2>
        <form id="news-form" class="stack">
          <label>
            RSS-URL
            <input
              type="url"
              id="news-url"
              placeholder="https://example.com/feed.xml"
              autocomplete="url"
              required
            />
          </label>
          <button type="submit">Abrufen</button>
        </form>
        <p id="news-status" class="muted small" role="status" aria-live="polite"></p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Feed-Vorschau</h2>
          <span id="news-count" class="badge">0 Artikel</span>
        </div>
        <div id="news-items" class="news-items muted">Noch keine Artikel geladen.</div>
      </section>

      <section class="panel">
        <h2>Rohdaten</h2>
        <pre id="news-output" class="code-block">Noch keine Daten.</pre>
      </section>
    </main>
    <script src="theme.js"></script>
    <script src="news.js"></script>
  </body>
</html>
