<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News-Feed Test</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="theme-toggle">
        <span>Dark Mode</span>
        <label class="switch">
          <input id="theme-toggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
      <header>
        <h1>News-Feed Test</h1>
        <p class="lede">
          Testseite zur Analyse der News-Quellen und ihrer Themenzuordnung. Keine KI, keine
          Veröffentlichung.
        </p>
        <nav class="nav">
          <a class="ghost-link" href="index.html">Zur Beitragsübersicht</a>
          <a class="ghost-link" href="prompts.html">Themen &amp; Quellen verwalten</a>
        </nav>
      </header>

      <section class="panel">
        <h2>Themen auswählen</h2>
        <div id="news-topics" class="properties-grid"></div>
        <div class="properties-actions">
          <button type="button" id="load-news">News anzeigen</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Aktuelle News</h2>
          <span id="news-count" class="muted small"></span>
        </div>
        <div id="news-results" class="posts"></div>
      </section>
    </main>
    <script src="theme.js"></script>
    <script src="news-test.js"></script>
  </body>
</html>
